<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список задач</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .delete-btn {
            background-color: red;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Список задач</h1>
    <table>
        <thead>
            <tr>
                <th>Номер</th>
                <th>Текст</th>
                <th>Действие</th>
            </tr>
        </thead>
        <tbody>
            {{rows}}
        </tbody>
    </table>
    <form action="/add" method="POST">
        <input type="text" name="newItem" placeholder="Добавить новую задачу" required>
        <button type="submit">Добавить</button>
    </form>
</body>
</html>
