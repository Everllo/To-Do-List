<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List — Добавление</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #todoList {
            border-collapse: collapse;
            width: 70%;
            margin: 0 auto;
        }
        #todoList th, #todoList td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #todoList th {
            background-color: #f0f0f0;
        }
        .add-form {
            margin-top: 20px;
            width: 70%;
            margin: 20px auto;
            display: flex;
            gap: 10px;
        }
        .add-form input[type="text"] {
            padding: 8px;
            flex: 1;
        }
        .add-form button {
            padding: 8px 16px;
        }
    </style>
</head>
<body>

<h2 style="text-align: center;">To-Do List</h2>

<table id="todoList">
    <thead>
        <tr>
            <th>ID</th>
            <th>Text</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        {{rows}}
    </tbody>
</table>

<div class="add-form">
    <input type="text" id="newItem" placeholder="Введите новую задачу">
    <button onclick="addItem()">Добавить</button>
</div>

<script>
    async function addItem() {
        const input = document.getElementById('newItem');
        const text = input.value.trim();

        if (!text) {
            alert('Введите текст задачи');
            return;
        }

        const response = await fetch('/add', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ text })
        });

        if (response.ok) {
            location.reload();
        } else {
            alert('Ошибка при добавлении задачи');
        }
    }
</script>

</body>
</html>
