<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Item</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .edit-form {
            margin-top: 50px;
            width: 50%;
            margin: 50px auto;
        }
        .edit-form input {
            padding: 8px;
            margin: 5px 0;
            width: 60%;
        }
        .edit-form button {
            padding: 8px;
            width: 30%;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        .message {
            margin-top: 20px;
            color: green;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>

<h2>Edit Item</h2>

<div class="edit-form">
    <input type="number" id="itemId" placeholder="Enter item ID"><br>
    <input type="text" id="newText" placeholder="Enter new text"><br>
    <button onclick="updateItem()">Update</button>
    <div id="message" class="message"></div>
</div>

<script>
    function updateItem() {
        const itemIdInput = document.getElementById('itemId');
        const newTextInput = document.getElementById('newText');
        const messageDiv = document.getElementById('message');
        const itemId = itemIdInput.value.trim();
        const newText = newTextInput.value.trim();

        if (itemId && newText) {
            fetch('/update', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ id: itemId, text: newText })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    messageDiv.textContent = `Item ${itemId} updated successfully!`;
                    messageDiv.className = 'message';
                    itemIdInput.value = '';
                    newTextInput.value = '';
                    setTimeout(() => {
                        messageDiv.textContent = '';
                    }, 2000);
                } else {
                    messageDiv.textContent = `Error updating item ${itemId}`;
                    messageDiv.className = 'message error';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                messageDiv.textContent = `Error updating item ${itemId}`;
                messageDiv.className = 'message error';
            });
        } else {
            messageDiv.textContent = 'Please enter both ID and new text';
            messageDiv.className = 'message error';
        }
    }
</script>

</body>
</html>
