<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Item</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .delete-form {
            margin-top: 50px;
            width: 50%;
            margin: 50px auto;
        }
        .delete-form input[type="number"] {
            padding: 8px;
            width: 60%;
        }
        .delete-form button {
            padding: 8px;
            width: 30%;
            background-color: #ff4444;
            color: white;
            border: none;
            cursor: pointer;
        }
        .message {
            margin-top: 20px;
            color: green;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>

<h2>Delete Item</h2>

<div class="delete-form">
    <input type="number" id="itemId" placeholder="Enter item ID to delete">
    <button onclick="deleteItem()">Delete</button>
    <div id="message" class="message"></div>
</div>

<script>
    function deleteItem() {
        const itemIdInput = document.getElementById('itemId');
        const messageDiv = document.getElementById('message');
        const itemId = itemIdInput.value.trim();

        if (itemId) {
            fetch('/delete', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ id: itemId })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    messageDiv.textContent = `Item ${itemId} deleted successfully!`;
                    messageDiv.className = 'message';
                    itemIdInput.value = '';
                    setTimeout(() => {
                        messageDiv.textContent = '';
                    }, 2000);
                } else {
                    messageDiv.textContent = `Error deleting item ${itemId}`;
                    messageDiv.className = 'message error';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                messageDiv.textContent = `Error deleting item ${itemId}`;
                messageDiv.className = 'message error';
            });
        } else {
            messageDiv.textContent = 'Please enter an item ID';
            messageDiv.className = 'message error';
        }
    }
</script>

</body>
</html>
