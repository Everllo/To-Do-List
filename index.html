<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>To-Do List — Редактирование</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #todoList {
            border-collapse: collapse;
            width: 70%;
            margin: 0 auto;
        }
        #todoList th, #todoList td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        #todoList input[type="text"] {
            width: 100%;
            padding: 6px;
        }
        .add-form {
            margin-top: 20px;
            width: 70%;
            margin: 20px auto;
        }
        .add-form input, .add-form button {
            padding: 8px;
        }
        .add-form input {
            width: 70%;
        }
        .add-form button {
            width: 28%;
        }
    </style>
</head>
<body>

<h2 style="text-align: center;">To-Do List</h2>

<table id="todoList">
    <thead>
        <tr>
            <th>ID</th>
            <th>Text</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        {{rows}}
    </tbody>
</table>

<div class="add-form">
    <input type="text" placeholder="Добавление отключено в этой ветке" disabled>
    <button disabled>Добавить</button>
</div>

<script>
    async function editItem(id, newText) {
        const response = await fetch('/edit', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ id, text: newText })
        });

        if (!response.ok) {
            alert('Ошибка при редактировании');
        }
    }
</script>

</body>
</html>
