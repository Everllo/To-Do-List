<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To-Do List (Add)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    #todoList {
      border-collapse: collapse;
      width: 70%;
      margin: 0 auto;
    }
    #todoList th,
    #todoList td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    #todoList th {
      background-color: #f0f0f0;
    }
    #todoList th:first-child,
    #todoList th:last-child {
      width: 5%;
    }
    #todoList th:nth-child(2) {
      width: 90%;
    }
    .add-form {
      margin: 20px auto;
      width: 70%;
      display: flex;
    }
    .add-form input[type="text"] {
      flex: 1;
      padding: 8px;
    }
    .add-form button {
      padding: 8px;
      margin-left: 8px;
    }
  </style>
</head>
<body>

  <h2 style="text-align: center;">To-Do List (Add)</h2>

  <table id="todoList">
    <thead>
      <tr>
        <th>Number</th>
        <th>Text</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="listBody">
      {{rows}}
    </tbody>
  </table>

  <div class="add-form">
    <form action="/add" method="POST" style="display: flex; width: 100%;">
      <input
        type="text"
        name="text"
        placeholder="Enter new item"
        required
      />
      <button type="submit">Add</button>
    </form>
  </div>

</body>
</html>
