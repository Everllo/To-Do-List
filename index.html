<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        #todoList {
            border-collapse: collapse;
            width: 70%;
            margin: 0 auto;
        }
        #todoList th, #todoList td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #todoList th {
            background-color: #f0f0f0;
        }
        #todoList th:first-child, #todoList th:last-child {
            width: 5%;
        }
        #todoList th:nth-child(2) {
            width: 80%;
        }
        #todoList th:nth-child(3) {
            width: 15%;
        }
        .add-form {
            margin-top: 20px;
            width: 70%;
            margin: 20px auto;
            display: flex;
            gap: 10px;
        }
        .add-form input[type="text"] {
            padding: 8px;
            width: 70%;
        }
        .add-form button {
            padding: 8px;
            width: 20%;
        }
        .edit-input {
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
        }
        button {
            cursor: pointer;
        }
        .action-buttons {
            display: flex;
            gap: 5px;
        }
    </style>
</head>
<body>

<h2 style="text-align: center;">To-Do List</h2>

<table id="todoList">
    <thead>
        <tr>
            <th>Number</th>
            <th>Text</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="listBody">
        {{rows}}
    </tbody>
</table>

<div class="add-form">
    <input type="text" id="newItem" placeholder="Enter new item">
    <button onclick="addItem()">Add</button>
</div>

<script>
    async function startEdit(id) {
        const row = document.querySelector(`tr[data-id="${id}"]`);
        const currentText = row.querySelector('.item-text').textContent;

        row.innerHTML = `
            <td>${id}</td>
            <td><input type="text" class="edit-input" value="${currentText}"></td>
            <td class="action-buttons">
                <button onclick="saveEdit(${id})">Save</button>
                <button onclick="cancelEdit(${id})">Cancel</button>
            </td>
        `;

        row.querySelector('.edit-input').focus();
    }

     async function saveEdit(id) {
        const row = document.querySelector(`tr[data-id="${id}"]`);
        const newText = row.querySelector('.edit-input').value.trim();

        if (newText) {
            try {
                const response = await fetch('/update', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `id=${id}&text=${encodeURIComponent(newText)}`
                });

                const result = await response.json();

                if (result.success) {
                    await refreshList();
                } else {
                    alert('Error saving changes');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error saving changes');
            }
        }
    }

    function cancelEdit(id) {
        refreshList();
    }

         async function removeItem(id) {
        if (confirm('Are you sure you want to delete this item?')) {
            try {
                const response = await fetch(`/delete?id=${id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (result.success) {
                    await refreshList();
                } else {
                    alert('Error deleting item');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error deleting item');
            }
        }
    }

    function addItem() {
        const newItemInput = document.getElementById('newItem');
        const newItemText = newItemInput.value.trim();

        if (newItemText) {
            itry {
                const response = await fetch('/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `text=${encodeURIComponent(newItemText)}`
                });

                const result = await response.json();

                if (result.success) {
                    newItemInput.value = '';
                    await refreshList();
                } else {
                    alert('Error adding item');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error adding item');
            }
        }
    }

    async function refreshList() {
        try {
            const response = await fetch('/');
            const html = await response.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const newBody = doc.getElementById('listBody').innerHTML;
            document.getElementById('listBody').innerHTML = newBody;
        } catch (error) {
            console.error('Error refreshing list:', error);
        }
    }
</script>

</body>
</html>
