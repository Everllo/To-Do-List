<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #todoList {
            border-collapse: collapse;
            width: 70%;
            margin: 0 auto;
        }
        #todoList th, #todoList td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #todoList th {
            background-color: #f0f0f0;
        }
        #todoList th:first-child, #todoList th:last-child {
            width: 5%;
        }
        #todoList th:nth-child(2) {
            width: 80%;
        }
        #todoList th:last-child {
            width: 15%;
        }
        .add-form {
            margin-top: 20px;
            width: 70%;
            margin: 20px auto;
        }
        .add-form input[type="text"] {
            padding: 8px;
            width: 70%;
        }
        .add-form button {
            padding: 8px;
            width: 20%;
        }
        .edit-input {
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<h2 style="text-align: center;">To-Do List</h2>

<table id="todoList">
    <thead>
        <tr>
            <th>Number</th>
            <th>Text</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="listBody">
        {{rows}}
    </tbody>
</table>

<div class="add-form">
    <input type="text" id="newItem" placeholder="Enter new item">
    <button id="addBtn">Add</button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const addBtn = document.getElementById('addBtn');
        const newItemInput = document.getElementById('newItem');
        
        // Обработчик добавления
        addBtn.addEventListener('click', addItem);
        newItemInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addItem();
        });
        
        // Делегирование событий для кнопок удаления и редактирования
        document.getElementById('listBody').addEventListener('click', function(e) {
            if (e.target.classList.contains('delete-btn')) {
                const id = e.target.getAttribute('data-id');
                removeItem(id);
            }
            
            if (e.target.classList.contains('edit-btn')) {
                const id = e.target.getAttribute('data-id');
                const text = e.target.getAttribute('data-text');
                startEdit(id, text, e.target.closest('tr'));
            }
            
            if (e.target.classList.contains('save-btn')) {
                const id = e.target.getAttribute('data-id');
                const input = e.target.closest('tr').querySelector('.edit-input');
                saveEdit(id, input.value);
            }
            
            if (e.target.classList.contains('cancel-btn')) {
                location.reload(); // Просто перезагружаем страницу для простоты
            }
        });
    });
    
    async function addItem() {
        const newItemInput = document.getElementById('newItem');
        const text = newItemInput.value.trim();
        
        if (text) {
            try {
                const response = await fetch('/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text })
                });
                
                if (response.ok) {
                    location.reload();
                }
            } catch (error) {
                console.error('Error adding item:', error);
            }
        }
    }
    
    async function removeItem(id) {
        try {
            const response = await fetch(`/delete/${id}`, {
                method: 'DELETE'
            });
            
            if (response.ok) {
                location.reload();
            }
        } catch (error) {
            console.error('Error deleting item:', error);
        }
    }
    
    function startEdit(id, text, row) {
        row.innerHTML = `
            <td>${row.cells[0].textContent}</td>
            <td><input type="text" class="edit-input" value="${text}"></td>
            <td>
                <button class="save-btn" data-id="${id}">Save</button>
                <button class="cancel-btn">Cancel</button>
            </td>
        `;
        row.querySelector('.edit-input').focus();
    }
    
    async function saveEdit(id, newText) {
        if (newText.trim()) {
            try {
                const response = await fetch(`/edit/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: newText.trim() })
                });
                
                if (response.ok) {
                    location.reload();
                }
            } catch (error) {
                console.error('Error updating item:', error);
            }
        }
    }
</script>

</body>
</html>
