<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
</head>

<body>
    <h1>To-Do List</h1>
    <form method="POST" action="/add">
        <input name="text" placeholder="Enter a task" required>
        <button type="submit">Add Task</button>
    </form>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Task</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody>
            {{rows}}
        </tbody>
    </table>
</body>

</html>
