<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #todoList {
            border-collapse: collapse;
            width: 70%;
            margin: 0 auto;
        }
        #todoList th, #todoList td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #todoList th {
            background-color: #f0f0f0;
        }
        #todoList th:first-child, #todoList th:last-child {
            width: 5%;
        }
        #todoList th:nth-child(2) {
            width: 90%;
        }
        .add-form {
            margin-top: 20px;
            width: 70%;
            margin: 20px auto;
        }
        .add-form input[type="text"] {
            padding: 8px;
            width: 70%;
        }
        .add-form button {
            padding: 8px;
            width: 20%;
        }
        #errorMessage {
            color: red;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<h2 style="text-align: center;">To-Do List</h2>

<table id="todoList">
    <thead>
        <tr>
            <th>Number</th>
            <th>Text</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="listBody">
        {{rows}}
    </tbody>
</table>

<div class="add-form">
    <input type="text" id="newItem" placeholder="Enter new item">
    <button onclick="addItem()">Add</button>
    <div id="errorMessage"></div>
</div>

<script>
    async function renderList() {
        try {
            const response = await fetch('/');
            const html = await response.text();
            document.getElementById('listBody').innerHTML = 
                html.match(/<tbody id="listBody">([\s\S]*?)<\/tbody>/)[1];
        } catch (error) {
            console.error('Error rendering list:', error);
            document.getElementById('errorMessage').textContent = 'Error loading list';
        }
    }

    async function addItem() {
        const newItemInput = document.getElementById('newItem');
        const errorMessage = document.getElementById('errorMessage');
        const newItemText = newItemInput.value.trim();

        errorMessage.textContent = '';
        
        if (!newItemText) {
            errorMessage.textContent = 'Please enter some text';
            return;
        }

        try {
            const response = await fetch('/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ text: newItemText })
            });
            
            const result = await response.json();
            if (result.success) {
                newItemInput.value = '';
                await renderList();
            } else {
                errorMessage.textContent = 'Failed to add item: ' + (result.error || 'Unknown error');
            }
        } catch (error) {
            console.error('Error adding item:', error);
            errorMessage.textContent = 'Error adding item: ' + error.message;
        }
    }

    async function removeItem(index) {
        // Implementation will be added in next feature
        try {
            const response = await fetch('/delete', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ index })
            });
            
            const result = await response.json();
            if (result.success) {
                await renderList();
            } else {
                document.getElementById('errorMessage').textContent = 
                    'Failed to delete item: ' + (result.error || 'Unknown error');
            }
        } catch (error) {
            console.error('Error deleting item:', error);
            document.getElementById('errorMessage').textContent = 
                'Error deleting item: ' + error.message;
        }
    }

    document.addEventListener('DOMContentLoaded', renderList);
</script>

</body>
</html>
