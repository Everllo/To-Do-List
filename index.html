<div class="add-form">
    <input type="text" id="newItem" placeholder="Enter new item">
    <button onclick="addItem()">Add</button>
    <input type="text" placeholder="Добавление отключено в этой ветке" disabled>
    <button disabled>Добавить</button>
</div>

<script>
    let items = [];
    let nextId = 1;

    function renderList() {
        const listBody = document.getElementById('listBody');
        listBody.innerHTML = '';

        items.forEach((item, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${item.text}</td>
                <td><button onclick="removeItem(${index})">Remove</button></td>
            `;
            listBody.appendChild(row);
    async function editItem(id, newText) {
        const response = await fetch('/edit', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ id, text: newText })
        });
    }

    function addItem() {
        const newItemInput = document.getElementById('newItem');
        const newItemText = newItemInput.value.trim();

        if (newItemText) {
            items.push({ id: nextId++, text: newItemText });
            newItemInput.value = '';
            renderList();
        if (!response.ok) {
            alert('Ошибка при редактировании');
        }
    }

    function removeItem(index) {
        items.splice(index, 1);
        renderList();
    }
</script>
