<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #todoList {
            border-collapse: collapse;
            width: 70%;
            margin: 0 auto;
        }
        #todoList th, #todoList td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #todoList th {
            background-color: #f0f0f0;
        }
        #todoList th:first-child, #todoList th:last-child {
            width: 5%;
        }
        #todoList th:nth-child(2) {
            width: 90%;
        }
        .edit-btn, .save-btn {
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
        }
        .edit-input {
            width: 90%;
            padding: 5px;
        }
    </style>
</head>
<body>

<h2 style="text-align: center;">To-Do List</h2>

<table id="todoList">
    <thead>
        <tr>
            <th>Number</th>
            <th>Text</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="listBody">
        {{rows}}
    </tbody>
</table>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = btn.getAttribute('data-id');
                const row = btn.closest('tr');
                
                // Show input and save button, hide text and edit button
                row.querySelector('.item-text').style.display = 'none';
                row.querySelector('.edit-input').style.display = 'inline-block';
                btn.style.display = 'none';
                row.querySelector('.save-btn').style.display = 'inline-block';
            });
        });

        document.querySelectorAll('.save-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const id = btn.getAttribute('data-id');
                const row = btn.closest('tr');
                const newText = row.querySelector('.edit-input').value.trim();
                
                if (newText) {
                    try {
                        const response = await fetch('/update', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ id, text: newText })
                        });

                        if (response.ok) {
                            // Reload the page to show the updated list
                            window.location.reload();
                        } else {
                            alert('Failed to update item');
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        alert('Failed to update item');
                    }
                }
            });
        });
    });
</script>

</body>
</html>
