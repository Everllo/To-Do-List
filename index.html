<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #todoList { border-collapse: collapse; width: 70%; margin: 0 auto; }
        #todoList th, #todoList td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        #todoList th { background-color: #f0f0f0; }
        .add-form { margin-top: 20px; width: 70%; margin: 20px auto; }
        .add-form input[type="text"] { padding: 8px; width: 70%; }
        .add-form button { padding: 8px; width: 20%; }
    </style>
</head>
<body>

<h2 style="text-align: center;">To-Do List</h2>

<table id="todoList">
    <thead>
        <tr><th>#</th><th>Text</th><th>Actions</th></tr>
    </thead>
    <tbody id="listBody"></tbody>
</table>

<div class="add-form">
    <input type="text" id="newItem" placeholder="Enter new item">
    <button onclick="addItem()">Add</button>
</div>

<script>
    let items = [];

    async function loadItems() {
        try {
            const res = await fetch('/items');
            items = await res.json();
            renderList();
        } catch (err) {
            console.error('Ошибка загрузки:', err);
        }
    }

    function renderList() {
        const listBody = document.getElementById('listBody');
        listBody.innerHTML = '';
        items.forEach((item, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${index + 1}</td>
                <td id="text-${item.id}">${item.text}</td>
                <td id="actions-${item.id}">
                    <button onclick="startEdit(${item.id}, '${item.text.replace(/'/g, "\\'")}')">Edit</button>
                    <button onclick="removeItem(${item.id})">Delete</button>
                </td>`;
            listBody.appendChild(row);
        });
    }

    async function addItem() {
        const input = document.getElementById('newItem');
        const text = input.value.trim();
        if (text) {
            await fetch('/items', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            input.value = '';
            loadItems();
        }
    }

    async function removeItem(id) {
        await fetch(`/items/${id}`, { method: 'DELETE' });
        loadItems();
    }

    function startEdit(id, oldText) {
        const textCell = document.getElementById(`text-${id}`);
        const actionsCell = document.getElementById(`actions-${id}`);

        textCell.innerHTML = `<input type="text" id="editInput-${id}" value="${oldText}" style="width: 95%;">`;
        actionsCell.innerHTML = `
            <button onclick="saveEdit(${id})">Save</button>
            <button onclick="loadItems()">Cancel</button>
        `;
    }

    async function saveEdit(id) {
        const input = document.getElementById(`editInput-${id}`);
        const newText = input.value.trim();
        if (!newText) return alert('Текст не может быть пустым');

        await fetch(`/items/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: newText })
        });
        loadItems();
    }

    document.addEventListener('DOMContentLoaded', loadItems);
</script>

</body>
</html>
