<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .edit-btn {
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
        }
        .edit-btn:hover {
            background-color: #0056b3;
        }
        .edit-form {
            display: inline;
        }
        form {
            margin-top: 20px;
        }
        input[type="text"] {
            padding: 5px;
            width: 200px;
        }
        button[type="submit"] {
            padding: 5px 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>To-Do List</h1>
    <table>
        <tr>
            <th>Number</th>
            <th>Text</th>
            <th>Action</th>
        </tr>
        {{rows}}
    </table>
    <form>
        <input type="text" placeholder="Enter new task">
        <button type="submit">Add</button>
    </form>
</body>
</html>
