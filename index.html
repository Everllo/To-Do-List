<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>To-Do List</title>
<style>
  body {
    font-family: Arial, sans-serif;
  }
  #todoList {
    border-collapse: collapse;
    width: 70%;
    margin: 0 auto;
  }
  #todoList th, #todoList td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: left;
  }
  #todoList th {
    background-color: #f0f0f0;
  }
  #todoList th:first-child, #todoList th:last-child {
    width: 5%;
  }
  #todoList th:nth-child(2) {
    width: 70%;
  }
  #todoList th:nth-child(3) {
    width: 10%;
  }
  #todoList th:nth-child(4) {
    width: 10%;
  }
  .add-form {
    margin-top: 20px;
    width: 70%;
    margin: 20px auto;
  }
  .add-form input[type="text"] {
    padding: 8px;
    width: 70%;
  }
  .add-form button {
    padding: 8px;
    width: 20%;
  }
  .edit-input {
    width: 100%;
    box-sizing: border-box;
    padding: 6px;
  }
</style>
</head>
<body>

<h2 style="text-align: center;">To-Do List</h2>

<table id="todoList">
  <thead>
    <tr>
      <th>Number</th>
      <th>Text</th>
      <th>Edit</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="listBody">
    {{rows}}
  </tbody>
</table>

<div class="add-form">
  <input type="text" id="newItem" placeholder="Enter new item" />
  <button onclick="addItem()">Add</button>
</div>

<script>
  // Items array and nextId will be managed on server side; here we just update DOM and communicate with server

  // Function to add a new item via POST
  async function addItem() {
    const newItemInput = document.getElementById('newItem');
    const newItemText = newItemInput.value.trim();
    if (!newItemText) return;

    try {
      const res = await fetch('/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: newItemText }),
      });
      if (res.ok) {
        newItemInput.value = '';
        location.reload(); // Reload page to get updated list
      } else {
        alert('Failed to add item');
      }
    } catch (err) {
      alert('Error adding item');
      console.error(err);
    }
  }

  // Function to remove item by id
  async function removeItem(id) {
    if (!confirm('Are you sure you want to remove this item?')) return;
    try {
      const res = await fetch('/remove', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id }),
      });
      if (res.ok) {
        location.reload();
      } else {
        alert('Failed to remove item');
      }
    } catch (err) {
      alert('Error removing item');
      console.error(err);
    }
  }

  // Function to start editing an item
  function startEdit(id) {
    const textTd = document.getElementById(`text-${id}`);
    const currentText = textTd.textContent;
    textTd.innerHTML = `<input type="text" id="edit-input-${id}" class="edit-input" value="${currentText}" />`;
    const editBtn = document.getElementById(`edit-btn-${id}`);
    editBtn.textContent = 'Save';
    editBtn.onclick = () => saveEdit(id);
  }

  // Function to save edited item
  async function saveEdit(id) {
    const input = document.getElementById(`edit-input-${id}`);
    const newText = input.value.trim();
    if (!newText) {
      alert('Text cannot be empty');
      return;
    }
    try {
      const res = await fetch('/edit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, text: newText }),
      });
      if (res.ok) {
        location.reload();
      } else {
        alert('Failed to save changes');
      }
    } catch (err) {
      alert('Error saving changes');
      console.error(err);
    }
  }
</script>

</body>
</html>
